name: iac-agent

on:
  pull_request:
    paths: ["solutions/iac-agent/**", ".github/workflows/iac-agent.yml"]
  push:
    branches: [main]
    paths: ["solutions/iac-agent/**", ".github/workflows/iac-agent.yml"]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solutions/iac-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest shellcheck-py
      - name: IAM policies cannot write (offline)
        run: pytest -q tests
      - name: Shell scripts lint
        run: shellcheck -x -S warning scripts/*.sh fixtures/*.sh fixtures/*/create.sh
