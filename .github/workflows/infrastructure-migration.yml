name: Infrastructure migration qualification
on:
  pull_request:
    paths:
      - 'solutions/infrastructure-migration/**'
      - '.github/workflows/infrastructure-migration.yml'
  push:
    branches: [main]
    paths:
      - 'solutions/infrastructure-migration/**'
      - '.github/workflows/infrastructure-migration.yml'
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres@sha256:f02121de6f74d30d8a94cd1d9584125e2178d7e6c377d8130112d4e52d867995
        env:
          POSTGRES_PASSWORD: fixture-ci-only
        ports:
          - 5432/tcp
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: solutions/infrastructure-migration
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install . --no-deps
      - run: ruff check .
      - run: ruff format --check .
      - name: Build isolated compiler
        run: |
          docker build -t infra-migration-compile:ci runner
          migration_runner_image=$(docker image inspect infra-migration-compile:ci --format '{{.Id}}')
          echo "INFRA_RUNNER_IMAGE=$migration_runner_image" >> "$GITHUB_ENV"
      - run: pytest
        env:
          INFRA_TEST_POSTGRES_DSN: host=127.0.0.1 port=${{ job.services.postgres.ports[5432] }} dbname=postgres user=postgres password=fixture-ci-only
      - run: infra-migration-demo --checkpoint demo.sqlite --output demo-report.json
      - run: infra-migration-demo --checkpoint demo.sqlite --output demo-report.json --acknowledge
      - run: infra-migration-demo --workflow cloudformation_migration --checkpoint cfn.sqlite --output cfn-report.json
      - run: infra-migration-demo --workflow cloudformation_migration --checkpoint cfn.sqlite --output cfn-report.json --acknowledge
