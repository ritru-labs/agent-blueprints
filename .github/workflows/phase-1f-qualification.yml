name: Phase 1F qualification

on:
  push:
    branches:
      - 'agent/**'

jobs:
  qualification:
    name: qualification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 solutions/jira-to-pr/experiments/control-plane/ci_qualification.py
