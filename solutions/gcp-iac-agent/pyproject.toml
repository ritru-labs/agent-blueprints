[project]
name = "gcp-iac-agent"
version = "0.1.0"
description = "Bring hand-built GCP infrastructure under Terraform with zero changes, proven by terraform plan."
requires-python = ">=3.11"
dependencies = [
    "anthropic[vertex]>=0.70",
    "google-genai>=2.29.0",
    "langgraph>=0.6",
    "langgraph-checkpoint-sqlite>=2.0",
    "pydantic>=2.7",
]

[project.scripts]
gcp-iac-agent = "gcp_iac_agent.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gcp_iac_agent"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
